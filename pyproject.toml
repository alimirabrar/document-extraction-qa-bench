[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-extraction-qa-bench"
version = "0.1.0"
description = "A lightweight evaluator for structured document-extraction outputs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
doc-qa = "doc_qa.cli:main"

[tool.setuptools]
packages = ["doc_qa"]
